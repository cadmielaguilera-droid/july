<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>July · Transferir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, warm, practical, a small family stall
   IDEA: the July transfer card, made tappable
   PICTURE: the data list itself, each row copies on tap
   COLOUR and TYPE: July cream #F1F0EC, ink #24211E, the three fruit dots; Outfit 600 + DM Mono 500
   LAYOUT: one centred column, logo, title, rows, one big Copy all button */
:root{color-scheme:light dark;
  --bg:light-dark(#F1F0EC,#1C1A17);--ink:light-dark(#24211E,#F1F0EC);
  --muted:light-dark(#6B655E,#B3ADA5);--card:light-dark(#FFFFFF,#272420);
  --rule:light-dark(#E4E1DA,#3A3631);--ok:light-dark(#4F6B3E,#9EB68C)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Outfit,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:clamp(32px,7vw,64px) 20px 48px}
header{text-align:center;margin-bottom:32px}
.logo{font-weight:600;font-size:64px;line-height:.9;letter-spacing:-.02em;margin:0}
.sub{font:500 13px/1 "DM Mono",ui-monospace,monospace;letter-spacing:.35em;margin:10px 0 0 .35em}
.dots{display:flex;gap:10px;justify-content:center;margin-top:16px}
.dots i{width:10px;height:10px;border-radius:50%}
h1{font-weight:600;font-size:36px;line-height:1.05;margin:36px 0 6px}
.bank{color:var(--muted);font:500 14px/1.2 "DM Mono",ui-monospace,monospace;letter-spacing:.18em;margin:0}
.list{background:var(--card);border-radius:22px;padding:4px 0;margin:0;list-style:none}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 20px;border:0;background:none;color:inherit;font:inherit;text-align:start;cursor:pointer;border-top:1px solid var(--rule)}
li:first-child .row{border-top:0}
.row:focus-visible,.all:focus-visible{outline:3px solid var(--ok);outline-offset:-3px;border-radius:14px}
.txt{flex:1}
.k{display:block;color:var(--muted);font:500 12px/1.3 "DM Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
.v{display:block;font-weight:500;font-size:19px;overflow-wrap:anywhere}
.tag{flex:none;font:500 13px/1 "DM Mono",ui-monospace,monospace;color:var(--muted);padding:8px 10px;border-radius:999px;border:1px solid var(--rule);white-space:nowrap}
.row.done .tag{color:var(--ok);border-color:var(--ok)}
.all{display:block;width:100%;min-height:56px;margin-top:20px;border:0;border-radius:16px;background:var(--ink);color:var(--bg);font:600 18px/1 Outfit,system-ui,sans-serif;cursor:pointer}
.hint{color:var(--muted);font-size:15px;text-align:center;margin:16px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:15px;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <p class="logo">july</p>
    <p class="sub">FRUTOS SECOS</p>
    <div class="dots" aria-hidden="true"><i style="background:#E6CB79"></i><i style="background:#DCA783"></i><i style="background:#9EB68C"></i></div>
    <h1>Transferir</h1>
    <p class="bank">BANCO FALABELLA</p>
  </header>

  <ul class="list" id="list"></ul>
  <button class="all" id="all" type="button">Copiar todos los datos</button>
  <p class="hint">Toca un dato para copiarlo y pégalo en la app de tu banco. ¡Gracias por tu compra!</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
{
  const data = [
    {k:"Nombre", v:"Silvana Neira Aravena"},
    {k:"RUT", v:"13.108.043-3", c:"13108043-3"},
    {k:"Banco", v:"Banco Falabella"},
    {k:"Tipo de cuenta", v:"Cuenta Corriente"},
    {k:"N° de cuenta", v:"1-023-022589-0", c:"10230225890"},
    {k:"Correo", v:"silvanaandreaneira@gmail.com"}
  ];
  const list = document.getElementById('list');
  const toast = document.getElementById('toast');
  let t;
  const say = m => { toast.textContent = m; toast.classList.add('on'); clearTimeout(t); t = setTimeout(() => toast.classList.remove('on'), 1800); };

  const copy = async text => {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      try {
        const a = document.createElement('textarea');
        a.value = text; a.setAttribute('readonly',''); a.style.position='fixed'; a.style.opacity='0';
        document.body.appendChild(a); a.select(); a.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy'); a.remove(); return ok;
      } catch (e2) { return false; }
    }
  };

  list.innerHTML = data.map((d,i) => `
    <li><button class="row" type="button" data-i="${i}" aria-label="Copiar ${d.k}: ${d.v}">
      <span class="txt"><span class="k">${d.k}</span><span class="v">${d.v}</span></span>
      <span class="tag">Copiar</span>
    </button></li>`).join('');

  list.addEventListener('click', async e => {
    const b = e.target.closest('.row'); if (!b) return;
    const d = data[b.dataset.i];
    if (await copy(d.c || d.v)) {
      list.querySelectorAll('.row.done').forEach(r => { r.classList.remove('done'); r.querySelector('.tag').textContent = 'Copiar'; });
      b.classList.add('done'); b.querySelector('.tag').textContent = 'Copiado';
      say(d.k + ' copiado');
    } else say('No se pudo copiar, mantén presionado el dato');
  });

  document.getElementById('all').addEventListener('click', async () => {
    const text = data.map(d => d.k + ': ' + d.v).join('\n');
    say(await copy(text) ? 'Datos copiados' : 'No se pudo copiar');
  });
}
</script>
</body>
</html>
