<title>31 Stickers · Transferir</title>

<style>
/* VOICE: friendly, tidy, a kid's sticker stall run with care
   IDEA: the 9,9 x 14 cm sticker pack card, turned into a tap-to-copy transfer card
   PICTURE: the black cat peeking over the top edge of the data card
   COLOUR and TYPE: cream #F3EEE2, olive #3E4F3A, black cat #1B1B1B, red #A8402C only for "by July"; Nunito 900/800/600
   LAYOUT: one centred column: wordmark, cat on the card, rows, one big Copy all button */
:root{color-scheme:light dark;
  --bg:light-dark(#F3EEE2,#1A211A);--ink:light-dark(#2E3A2B,#F3EEE2);
  --brand:light-dark(#3E4F3A,#F3EEE2);--by:light-dark(#A8402C,#E58C74);
  --muted:light-dark(#5D6658,#B9C2B2);--card:light-dark(#FFFFFF,#263025);
  --rule:light-dark(#E7E1D3,#3A4637);--ok:light-dark(#3E4F3A,#B9D3A6);
  --catb:light-dark(#1B1B1B,#F3EEE2);--cate:light-dark(#F3EEE2,#1A211A);
  --btn:light-dark(#3E4F3A,#F3EEE2);--btnink:light-dark(#F3EEE2,#1F2A1D)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:600 17px/1.45 Nunito,"Trebuchet MS",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:clamp(28px,6vw,56px) 20px 48px}
header{text-align:center}
.word{display:block;width:min(300px,78%);height:auto;margin:0 auto}
.wm{fill:var(--brand)}.by{fill:var(--by)}
h1{font-weight:900;font-size:34px;line-height:1.05;margin:22px 0 4px;color:var(--brand)}
.bank{color:var(--muted);font-size:15px;margin:0}
.wrap{position:relative;margin-top:76px}
.cat{position:absolute;left:50%;top:-92px;width:112px;height:auto;transform:translateX(-50%);pointer-events:none}
.cb{fill:var(--catb)}.ce{fill:var(--cate)}
.list{background:var(--card);border-radius:22px;padding:4px 0;margin:0;list-style:none;box-shadow:0 1px 0 var(--rule),0 10px 30px -18px rgba(46,58,43,.35)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 20px;border:0;background:none;color:inherit;font:inherit;text-align:start;cursor:pointer;border-top:1px solid var(--rule)}
li:first-child .row{border-top:0;padding-top:22px}
.row:focus-visible,.all:focus-visible{outline:3px solid var(--ok);outline-offset:-3px;border-radius:14px}
.txt{flex:1}
.k{display:block;color:var(--muted);font-size:14px;font-weight:700}
.v{display:block;font-weight:800;font-size:19px;overflow-wrap:anywhere}
.tag{flex:none;font-size:14px;font-weight:800;color:var(--muted);padding:8px 12px;border-radius:999px;border:1.5px solid var(--rule);white-space:nowrap}
.row.done .tag{color:var(--ok);border-color:var(--ok)}
.all{display:block;width:100%;min-height:56px;margin-top:20px;border:0;border-radius:16px;background:var(--btn);color:var(--btnink);font:900 18px/1 Nunito,system-ui,sans-serif;cursor:pointer}
.all:active,.row:active{transform:scale(.99)}
.hint{color:var(--muted);font-size:15px;text-align:center;margin:16px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--btn);color:var(--btnink);padding:12px 18px;border-radius:999px;font-size:15px;font-weight:800;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}.all:active,.row:active{transform:none}}
</style>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
{
  const data = [
    {k:"Nombre", v:"Silvana Neira Aravena"},
    {k:"RUT", v:"13.108.043-3", c:"13108043-3"},
    {k:"Banco", v:"Banco Falabella"},
    {k:"Tipo de cuenta", v:"Cuenta Corriente"},
    {k:"N° de cuenta", v:"1-023-022589-0", c:"10230225890"},
    {k:"Correo", v:"silvanaandreaneira@gmail.com"}
  ];
  const list = document.getElementById('list');
  const toast = document.getElementById('toast');
  let t;
  const say = m => { toast.textContent = m; toast.classList.add('on'); clearTimeout(t); t = setTimeout(() => toast.classList.remove('on'), 1800); };

  const copy = async text => {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      try {
        const a = document.createElement('textarea');
        a.value = text; a.setAttribute('readonly',''); a.style.position='fixed'; a.style.opacity='0';
        document.body.appendChild(a); a.select(); a.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy'); a.remove(); return ok;
      } catch (e2) { return false; }
    }
  };

  list.innerHTML = data.map((d,i) => `
    <li><button class="row" type="button" data-i="${i}" aria-label="Copiar ${d.k}: ${d.v}">
      <span class="txt"><span class="k">${d.k}</span><span class="v">${d.v.replace("@","@<wbr>")}</span></span>
      <span class="tag">Copiar</span>
    </button></li>`).join('');

  list.addEventListener('click', async e => {
    const b = e.target.closest('.row'); if (!b) return;
    const d = data[b.dataset.i];
    if (await copy(d.c || d.v)) {
      list.querySelectorAll('.row.done').forEach(r => { r.classList.remove('done'); r.querySelector('.tag').textContent = 'Copiar'; });
      b.classList.add('done'); b.querySelector('.tag').textContent = 'Copiado';
      say(d.k + ' copiado');
    } else say('No se pudo copiar, mantén presionado el dato');
  });

  document.getElementById('all').addEventListener('click', async () => {
    const text = data.map(d => d.k + ': ' + d.v).join('\n');
    say(await copy(text) ? 'Datos copiados' : 'No se pudo copiar');
  });
}
